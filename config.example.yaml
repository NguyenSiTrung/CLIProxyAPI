# Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
# Use "127.0.0.1" or "localhost" to restrict access to local machine only.
host: ""

# Server port
port: 8317

# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
  enable: false
  cert: ""
  key: ""

# Management API settings
remote-management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (a key is still required).
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
  secret-key: ""

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

  # Use custom management panel instead of upstream auto-updated version.
  # When true, serves static/custom-management.html (or custom path below).
  # Allows customizing the admin panel without conflicts from upstream updates.
  use-custom-management-panel: false

  # Path to custom management panel HTML file. Relative paths use config directory as base.
  # Default: static/custom-management.html
  # custom-management-panel-path: "static/custom-management.html"

# Authentication directory (supports ~ for home directory)
auth-dir: "~/.cli-proxy-api"

# API keys for authentication
api-keys:
  - "your-api-key-1"
  - "your-api-key-2"
  - "your-api-key-3"

# Access Key Cost Limits
# Configure per-access-key cost and request count limits to block requests when limits are exceeded.
# Supports automatic reset intervals (hourly/daily/weekly/monthly) or a custom duration like 5h.
# access-key-limits:
#   # Enable cost limit enforcement (default: false)
#   enabled: false
#   # Default maximum cost (USD) for keys not explicitly configured.
#   # Set to 0 for unlimited (no limit enforced).
#   default-max-cost: 10.00
#   # Default maximum request count for keys not explicitly configured.
#   # Set to 0 for unlimited (no limit enforced).
#   default-max-requests: 1000
#   # When true, only count successful requests (HTTP status < 400) against request limits.
#   # When false (default), all requests are counted including 4xx/5xx errors.
#   count-only-success-requests: false
#   # Per-key cost limit overrides
#   keys:
#     # Simple single-tier example (legacy format)
#     - api-key: "your-api-key-1"
#       max-cost: 25.00          # Higher limit for power users
#       max-requests: 5000       # Request count limit
#       auto-reset-interval: daily  # Reset counters daily (hourly/daily/weekly/monthly/none/5h)
#       expires-at: "2026-12-31T00:00:00Z" # Optional expiration time (RFC3339)
#     - api-key: "your-api-key-2"
#       max-cost: 5.00           # Lower limit for testing
#       max-requests: 100        # Lower request limit
#       auto-reset-interval: none   # Manual reset only (default)
#     - api-key: "your-api-key-3"
#       max-cost: 0              # Unlimited cost (no limit enforced)
#       max-requests: 0          # Unlimited requests (no limit enforced)
#
#     # Multi-tier quota example - multiple limits enforced simultaneously
#     # Each tier resets independently based on its own interval.
#     # Requests are blocked if ANY tier is exceeded.
#     - api-key: "your-api-key-4"
#       quota-rules:
#         - id: "burst"            # Short-term burst limit
#           max-requests: 100
#           auto-reset-interval: 1h
#         - id: "daily"            # Daily limit
#           max-requests: 2000
#           max-cost: 50.00
#           auto-reset-interval: daily
#         - id: "monthly"          # Monthly budget
#           max-cost: 500.00
#           auto-reset-interval: monthly

# Access Key Auth Routing
# Restrict which auth JSON files are used for requests authenticated by a client API key.
# Use auth file IDs (relative paths or file names) as returned by /v0/management/auth-files.
# access-key-auths:
#   - api-key: "your-api-key-1"
#     provider: "antigravity" # Optional; omit to apply to all providers
#     auth-ids:
#       - "antigravity-you_example_com.json"
#       - "antigravity-other.json"

# Enable debug logging
debug: false

# When true, disable high-overhead HTTP middleware features to reduce per-request memory usage under high concurrency.
commercial-mode: false

# When true, write application logs to rotating files instead of stdout
logging-to-file: false

# Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
# files are deleted until within the limit. Set to 0 to disable.
logs-max-total-size-mb: 0

# When false, disable in-memory usage statistics aggregation
usage-statistics-enabled: false

# Automatic backup of usage statistics to file
# usage-auto-backup:
#   enabled: false
#   # Backup interval in minutes (default: 60)
#   interval-minutes: 60
#   # Directory where backup files are saved (supports ~ for home dir)
#   folder-path: "./backups"
#   # Prefix for backup filenames
#   filename-prefix: "cliproxy-usage-backup"
#   # Perform backup when server receives shutdown signal (docker-compose down, SIGTERM)
#   backup-on-shutdown: true
#   # Maximum number of backup files to keep (0 = unlimited)
#   max-backup-files: 24

# Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
proxy-url: ""

# When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
force-model-prefix: false

# Number of times to retry a request. Retries will occur if the HTTP response code is 403, 408, 500, 502, 503, or 504.
request-retry: 3

# Maximum wait time in seconds for a cooled-down credential before triggering a retry.
max-retry-interval: 30

# Quota exceeded behavior
quota-exceeded:
  switch-project: true # Whether to automatically switch to another project when a quota is exceeded
  switch-preview-model: true # Whether to automatically switch to a preview model when a quota is exceeded

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "round-robin" # round-robin (default), fill-first

# When true, enable authentication for the WebSocket API (/v1/ws).
ws-auth: false

# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0

# Streaming behavior (SSE keep-alives + safe bootstrap retries).
# streaming:
#   keepalive-seconds: 15   # Default: 0 (disabled). <= 0 disables keep-alives.
#   bootstrap-retries: 1    # Default: 0 (disabled). Retries before first byte is sent.

# When true, enable official Codex instructions injection for Codex API requests.
# When false (default), CodexInstructionsForModel returns immediately without modification.
codex-instructions-enabled: false
# Gemini API keys
